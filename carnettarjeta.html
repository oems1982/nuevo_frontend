<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carnet Individual</title>
  <link rel="stylesheet" href="style-tarjeta.css">
  <link rel="stylesheet" href="style.css" />
  </head>
<body>

  <div>
    <form id="searchForm">
      <input type="text" id="documentInput" placeholder="Ingrese documento" required />
      <button type="submit">Buscar</button>
    </form>

    <div class="card-container" id="card" style="display: none;">
      <div class="card-header">
        <img id="photo" class="card-photo" src="" alt="Foto" />
        <h2 id="name"></h2>
      </div>

      <div class="card-field"><span class="label">Documento: </span><span id="document"></span></div>
      <div class="card-field"><span class="label">Email: </span><span id="email"></span></div>
      <div class="card-field"><span class="label">Cargo: </span><span id="cargo"></span></div>
    </div>
  </div>

  <script src="carnet-tarjeta.html"></script>
</body>
</html>
